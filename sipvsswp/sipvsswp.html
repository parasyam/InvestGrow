</head>

    <div id="nav">

    <div class="comparison-wrapper">
      <h3 id="head">SIP vs SWP Comparison</h3>
      
      <div class="comparison-container">
        <!-- SIP Section -->
        <div class="comparison-section">
          <h3>SIP (Systematic Investment Plan)</h3>
          
          <div class="input-section">
            <div class="input-group">
              <label for="capital">Monthly Investment Amount (₹)</label>
              <input type="number" id="capital" placeholder="Enter monthly investment">
            </div>
            <div class="input-group">
              <label for="sipt">Investment Period (Years)</label>
              <input type="number" id="sipt" placeholder="Enter tenure in years">
            </div>
            <div class="input-group">
              <label for="returns">Expected Return Rate (% p.a.)</label>
              <input type="number" id="returns" placeholder="Enter expected return p.a">
            </div>
          </div>
          
          <div id="result"></div>
          <div class="chart-container">
            <canvas id="sip" width="400" height="250"></canvas>
          </div>
        </div>
        
        <!-- SWP Section -->
        <div class="comparison-section">
          <h3>SWP (Systematic Withdrawal Plan)</h3>
          
          <div class="input-section">
            <div class="input-group">
              <label for="emw">Monthly Withdrawal Amount (₹)</label>
              <input type="number" id="emw" placeholder="Enter monthly withdrawal">
            </div>
            <div class="input-group">
              <label for="swpt">Withdrawal Period (Years)</label>
              <input type="number" id="swpt" placeholder="Enter tenure in years">
            </div>
          </div>
          
          <div id="resultR"></div>
          <div class="chart-container">
            <canvas id="swp" width="400" height="250"></canvas>
          </div>
        </div>
      </div>
      
      <button onclick="sip()" id="but">Compare SIP vs SWP</button>
      <div id="whowon"></div>
    </div>
    

    <script src="sipvsswp.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

</body>
