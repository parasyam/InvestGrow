    <div class="comparison-wrapper">
      <h3 id="head">FD vs Mutual Fund Comparison</h3>
      
      <div class="comparison-container">
        <!-- Fixed Deposit Section -->
        <div class="comparison-section">
          <h3>Fixed Deposit</h3>
          
          <div class="input-section">
            <div class="input-group">
              <label for="fdc">Principal Amount (₹)</label>
              <input type="number" id="fdc" placeholder="Enter capital amount">
            </div>
            <div class="input-group">
              <label for="fdt">Time Period (Years)</label>
              <input type="number" id="fdt" placeholder="Enter tenure in years">
            </div>
            <div class="input-group">
              <label for="fdr">Interest Rate (% p.a.)</label>
              <input type="number" id="fdr" placeholder="Enter rate of interest p.a">
            </div>
          </div>
          
          <div id="result"></div>
          <div class="chart-container">
            <canvas id="fdchart" width="400" height="200"></canvas>
          </div>
        </div>
        
        <!-- Mutual Fund Section -->
        <div class="comparison-section">
          <h3>Mutual Fund</h3>
          
          <div class="input-section">
            <div class="input-group">
              <label for="mir">Expected Return Rate (% p.a.)</label>
              <input type="number" id="mir" placeholder="Enter expected return p.a">
            </div>
          </div>
          
          <div id="resultR"></div>
          <div class="chart-container">
            <canvas id="mutualchart" width="400" height="200"></canvas>
          </div>
        </div>
      </div>
      
      <button onclick="fd()" id="but">Compare Investments</button>
      <div id="whowon"></div>
    </div>
